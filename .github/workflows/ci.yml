name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # Add `npm run smoke:ide` here in the same commit that lands `src/ide/`.
      # It drives the built shim over a real socket and needs no `omp` binary
      # and no credentials, so it belongs in this gate — but the script only
      # exists alongside the bridge, and a gate must never skip silently.

      # Prove the artifact the team installs still builds from a clean checkout.
      - run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: omp-ui-vsix
          path: "*.vsix"
          if-no-files-found: error

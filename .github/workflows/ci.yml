name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # Every smoke that needs neither an `omp` binary nor credentials belongs
      # in this gate. `smoke` and `smoke:sessions` do need both, so they stay
      # out: a gate must never skip silently.
      - run: npm run smoke:ide

      - run: npm run smoke:tests

      # Creates its own throwaway repo and configures an identity in it, so it
      # needs nothing from the runner but `git`.
      - run: npm run smoke:checkpoint

      # Prove the artifact the team installs still builds from a clean checkout.
      - run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: omp-ui-vsix
          path: "*.vsix"
          if-no-files-found: error

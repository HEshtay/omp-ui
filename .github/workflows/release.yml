name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # A tag that disagrees with package.json would publish a .vsix whose
      # filename and installed version differ from the release the team
      # downloaded. Fail loudly instead.
      - name: Check tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Add `npm run smoke:ide` here together with `src/ide/`, matching ci.yml.
      - run: npm run package

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "omp-ui-$version.vsix" \
            --title "omp-ui $version" \
            --generate-notes
